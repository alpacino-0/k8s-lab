version: "2"
run:
  allow-parallel-runners: true
linters:
  default: none
  enable:
    - copyloopvar
    - depguard
    - dupl
    - errcheck
    - ginkgolinter
    - goconst
    - gocyclo
    - govet
    - ineffassign
    - lll
    - modernize
    - misspell
    - nakedret
    - prealloc
    - revive
    - staticcheck
    - unconvert
    - unparam
    - unused
    - logcheck
  settings:
    custom:
      logcheck:
        type: "module"
        description: Checks Go logging calls for Kubernetes logging conventions.
    depguard:
      rules:
        forbid-sort-pkg:
          deny:
            - pkg: sort
              desc: Should be replaced with slices package
    revive:
      rules:
        - name: comment-spacings
        - name: import-shadowing
    modernize:
      disable:
        - omitzero
        - newexpr
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        path: api/*
      - linters:
          - dupl
          - lll
        path: internal/*
    paths:
      - third_party$
      - builtin$
      - examples$
      # The module root is the repository root, so golangci-lint walks into the
      # reference tenant's node_modules, which carries a vendored Go package of
      # its own. GO_PKGS keeps go build/vet/test out of there; this keeps the
      # linter out. Neither is cosmetic: it reported four issues in a
      # third-party file nobody here can fix.
      - ^app/
formatters:
  enable:
    - gofmt
    - goimports
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
      # The module root is the repository root, so golangci-lint walks into the
      # reference tenant's node_modules, which carries a vendored Go package of
      # its own. GO_PKGS keeps go build/vet/test out of there; this keeps the
      # linter out. Neither is cosmetic: it reported four issues in a
      # third-party file nobody here can fix.
      - ^app/
