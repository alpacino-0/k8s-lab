{{- if .Values.postgres.enabled }}
{{- if not .Values.postgres.auth.existingSecret }}
{{- /*
  Generated when unset, and kept once the database exists.

  `required` was the guard here and it does not catch what actually happens: it
  fires on an empty value, and the default was the non-empty string `change-me`,
  so the check passed and the install got a known password. An empty default
  plus generation is the shape that has no such gap.

  Preserving the live value is not tidiness here — the password is baked into
  the data directory when Postgres first initialises, so a value that rotates on
  upgrade locks the application out of its own database while the server keeps
  the old one.
*/}}
{{- $pgName := include "postgres.fullname" . }}
{{- $livePg := (lookup "v1" "Secret" .Release.Namespace $pgName) | default dict }}
{{- $livePgData := (get $livePg "data") | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $pgName }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
data:
  POSTGRES_USER: {{ .Values.postgres.auth.username | toString | b64enc | quote }}
  POSTGRES_DB: {{ .Values.postgres.auth.database | toString | b64enc | quote }}
  {{- if .Values.postgres.auth.password }}
  POSTGRES_PASSWORD: {{ .Values.postgres.auth.password | toString | b64enc | quote }}
  {{- else if hasKey $livePgData "POSTGRES_PASSWORD" }}
  POSTGRES_PASSWORD: {{ get $livePgData "POSTGRES_PASSWORD" | quote }}
  {{- else }}
  POSTGRES_PASSWORD: {{ randAlphaNum 40 | b64enc | quote }}
  {{- end }}
---
{{- end }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  clusterIP: None          # headless: gives each pod a stable DNS name
  selector:
    {{- include "postgres.selectorLabels" . | nindent 4 }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "postgres.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
spec:
  serviceName: {{ include "postgres.fullname" . }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "postgres.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "postgres.selectorLabels" . | nindent 8 }}
    spec:
      automountServiceAccountToken: false   # PostgreSQL never calls the API
      terminationGracePeriodSeconds: 60     # let PostgreSQL checkpoint cleanly
      securityContext:
        runAsNonRoot: true
        runAsUser: 70                        # "postgres" in the alpine image
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: postgres
          image: {{ .Values.postgres.image | quote }}
          securityContext:
            allowPrivilegeEscalation: false
            # PostgreSQL writes only to its data directory, its socket
            # directory and /tmp — all mounted volumes. The root filesystem
            # can stay read-only, which was verified before the policy that
            # requires it was written.
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          envFrom:
            - secretRef:
                name: {{ include "postgres.secretName" . }}
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          ports:
            - name: postgres
              containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB -q"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -q"]
            initialDelaySeconds: 30
            periodSeconds: 15
            failureThreshold: 5
          resources:
            {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        # Stated explicitly because the API server defaults it. A field the
        # manifest leaves out and the server fills in is a permanent diff for
        # anything comparing desired state against live state.
        volumeMode: Filesystem
        {{- if .Values.postgres.persistence.storageClass }}
        storageClassName: {{ .Values.postgres.persistence.storageClass | quote }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgres.persistence.size }}
{{- end }}
