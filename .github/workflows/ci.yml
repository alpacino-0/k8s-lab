name: CI/CD

on:
  push:
    branches: [ main ]
  pull_request:

env:
  IMAGE: ghcr.io/${{ github.repository }}

jobs:
  # 1) Imaji uret ve konteyner gercekten ayaga kalkiyor mu, dogrula
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Imaji build et
        run: docker build -t k8s-lab-app:test ./app

      - name: Duman testi (smoke test)
        run: |
          docker run -d -p 8080:3000 --name test k8s-lab-app:test
          for i in $(seq 1 15); do
            curl -sf localhost:8080/healthz && break || sleep 1
          done
          curl -sf localhost:8080/healthz | grep -q ok
          curl -sf localhost:8080/ | grep -q Konteyner
          docker rm -f test

  # 1b) Manifest ve chart dogrulamasi — cluster gerektirmez, hizli
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Helm chart lint
        run: helm lint chart
      - name: Chart sablonu uretilebiliyor mu
        run: |
          helm template prod chart -f chart/values-prod.yaml > /dev/null
          helm template dev  chart -f chart/values-dev.yaml  > /dev/null

  # 2) Gercek bir kind cluster kurup deploy et — manifestler dogru mu?
  k8s-test:
    runs-on: ubuntu-latest
    needs: [build-test, lint]
    steps:
      - uses: actions/checkout@v4

      - name: kind cluster kur
        uses: helm/kind-action@v1
        with:
          cluster_name: ci

      - name: Imaji build et ve node'lara yukle
        run: |
          docker build -t k8s-lab-app:3.3 ./app
          kind load docker-image k8s-lab-app:3.3 --name ci

      # Gercek k8s/secret.yaml .gitignore'da — CI sablondan uretir.
      # pg-secret'i postgres.yaml zaten tanimliyor.
      - name: Secret'i sablondan uret
        run: |
          sed 's/BURAYA-GERCEK-PAROLA/ci-test-parolasi/' k8s/secret.yaml.ornek > k8s/secret.yaml

      - name: PostgreSQL'i kur
        run: |
          kubectl apply -f k8s/postgres.yaml
          kubectl rollout status statefulset/pg --timeout=300s

      - name: Deploy
        run: |
          kubectl apply -f k8s/configmap.yaml -f k8s/secret.yaml
          kubectl apply -f k8s/deployment.yaml -f k8s/service.yaml
          kubectl rollout status deployment/k8s-lab-app --timeout=300s

      - name: Veritabani ucu gercekten calisiyor mu?
        run: |
          kubectl run kontrol --rm -i --restart=Never --image=curlimages/curl -- \
            curl -sf -X POST -H 'Content-Type: application/json' \
            -d '{"metin":"ci testi"}' http://k8s-lab-app/notlar | grep -q "ci testi"

      - name: Dogrula
        run: |
          kubectl get pods -o wide
          kubectl run kontrol --rm -i --restart=Never --image=curlimages/curl -- \
            curl -sf http://k8s-lab-app/healthz | grep -q ok

      - name: Hata durumunda teshis bilgisi bas
        if: failure()
        run: |
          kubectl get pods -o wide
          kubectl describe pods -l app=k8s-lab-app
          kubectl logs -l app=k8s-lab-app --tail=50 || true

  # 3) Sadece main'e push'ta: imaji GitHub Container Registry'e gonder
  publish:
    runs-on: ubuntu-latest
    needs: k8s-test
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: GHCR'a giris yap
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}   # otomatik saglanir

      - name: Build ve push
        uses: docker/build-push-action@v6
        with:
          context: ./app
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
