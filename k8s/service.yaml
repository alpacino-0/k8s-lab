apiVersion: v1
kind: Service
metadata:
  name: k8s-lab-app
spec:
  type: NodePort
  selector:
    app: k8s-lab-app       # bu etiketli TUM pod'lara yuk dagit
  ports:
    - port: 80             # servisin cluster ici portu
      targetPort: 3000     # pod'un portu
      nodePort: 30080      # node uzerinde acilan port (kind bunu 8080'e bagladi)
