{{- if .Values.appSecret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "app.fullname" . }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.appSecret.values }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
