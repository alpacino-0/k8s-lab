apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: k8s-lab-app
  labels:
    release: izleme
spec:
  groups:
    - name: k8s-lab-app
      rules:
        # TUZAK: up == 0, hedefler tamamen kaybolunca ATESLEMEZ (seri yok olur).
        - alert: UygulamaKapali
          expr: up{job="k8s-lab-app"} == 0
          for: 30s
          labels:
            severity: critical
          annotations:
            ozet: "Pod {{ $labels.pod }} metrik vermiyor"

        # DOGRUSU: absent() — seri hic yoksa atesler.
        - alert: HicHedefYok
          expr: absent(up{job="k8s-lab-app"})
          for: 30s
          labels:
            severity: critical
          annotations:
            ozet: "k8s-lab-app hedefi Prometheus'ta hic gorunmuyor"

        - alert: HataOraniYuksek
          expr: |
            sum(rate(http_istek_toplam{durum=~"5.."}[2m]))
            /
            sum(rate(http_istek_toplam[2m])) > 0.1
          for: 1m
          labels:
            severity: warning
          annotations:
            ozet: "5xx orani %10'un uzerinde"

        - alert: YanitYavas
          expr: |
            histogram_quantile(0.95,
              sum by (le) (rate(http_istek_suresi_saniye_bucket[2m]))
            ) > 0.5
          for: 1m
          labels:
            severity: warning
          annotations:
            ozet: "p95 yanit suresi 500ms uzerinde"

        - alert: HicHazirPodYok
          expr: kube_deployment_status_replicas_available{deployment="k8s-lab-app"} == 0
          for: 30s
          labels:
            severity: critical
          annotations:
            ozet: "k8s-lab-app'in hazir pod'u kalmadi"
