# Pod Security Admission, enforced at the namespace.
#
# enforce  — rejects the pod
# audit    — records a violation in the audit log
# warn     — returns a warning to whoever submitted it
#
# All three are set to restricted: enforcement blocks, and the other two make
# violations visible for anything that bypasses the check (existing pods,
# subresources).
apiVersion: v1
kind: Namespace
metadata:
  name: damga
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Opts this namespace into the ValidatingAdmissionPolicy bindings.
    damga.co/policies: enforced
    # And out of one of them. `make up` builds damga-app locally and loads it
    # into the node; it never reaches a registry, so it has no signature and
    # never will. This label is the namespace saying so out loud rather than
    # the rule quietly allowing it everywhere. A tenant namespace does not
    # carry it, and there an unsigned image is rejected.
    damga.co/unsigned-images: permitted
