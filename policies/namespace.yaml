# Pod Security Admission, enforced at the namespace.
#
# enforce  — rejects the pod
# audit    — records a violation in the audit log
# warn     — returns a warning to whoever submitted it
#
# All three are set to restricted: enforcement blocks, and the other two make
# violations visible for anything that bypasses the check (existing pods,
# subresources).
apiVersion: v1
kind: Namespace
metadata:
  name: damga
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Two labels used to be here, opting this namespace into the
    # ValidatingAdmissionPolicy bindings and out of the image-signature one.
    # The policies were removed on 2026-08-29 and the labels outlived them by
    # four days: nothing selected on them, so they were a rule this file
    # appeared to be under and was not.
