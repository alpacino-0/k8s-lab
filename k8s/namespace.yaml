apiVersion: v1
kind: Namespace
metadata:
  name: staging
---
apiVersion: v1
kind: ResourceQuota          # bu namespace toplamda ne kadar tuketebilir
metadata:
  name: staging-kota
  namespace: staging
spec:
  hard:
    requests.cpu: "500m"
    requests.memory: 512Mi
    pods: "4"
---
apiVersion: v1
kind: LimitRange             # limit yazmayan konteynere varsayilan ata
metadata:
  name: staging-varsayilan
  namespace: staging
spec:
  limits:
    - type: Container
      default:
        cpu: 100m
        memory: 128Mi
      defaultRequest:
        cpu: 50m
        memory: 64Mi
