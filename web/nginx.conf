# Serves the built SPA. API traffic never passes through here — the ingress
# routes /api straight to the backend Service, so this container holds no
# upstream configuration and needs no network egress at all.

worker_processes auto;
pid /tmp/nginx.pid;

events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  # Everything nginx writes is redirected under /tmp so the root filesystem
  # can stay read-only.
  client_body_temp_path /tmp/client_body;
  proxy_temp_path       /tmp/proxy;
  fastcgi_temp_path     /tmp/fastcgi;
  uwsgi_temp_path       /tmp/uwsgi;
  scgi_temp_path        /tmp/scgi;
  access_log            /dev/stdout;
  error_log             /dev/stderr warn;

  sendfile      on;
  tcp_nopush    on;
  server_tokens off;

  gzip              on;
  gzip_vary         on;
  gzip_min_length   512;
  gzip_types        text/plain text/css application/javascript application/json image/svg+xml;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    include /etc/nginx/security-headers.conf;

    location = /healthz {
      access_log off;
      include /etc/nginx/security-headers.conf;
      add_header Content-Type text/plain;
      return 200 "ok\n";
    }

    # Hashed assets never change content, so they can be cached hard.
    location /assets/ {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "public, immutable";
      expires 1y;
      try_files $uri =404;
    }

    # Single-page app: unknown paths return the shell, not a 404.
    location / {
      include /etc/nginx/security-headers.conf;
      add_header Cache-Control "no-cache";
      try_files $uri $uri/ /index.html;
    }
  }
}
