# Bindings scope the policies to namespaces that opt in by label.
#
# Selecting on a label rather than a name means a new namespace joins by
# carrying the label, not by editing three bindings — and a namespace can be
# left out deliberately, which is how the probe namespace used by the smoke
# test is allowed to run a throwaway curl pod.
#
# Kept separate from the policies on purpose: the same policy can be bound
# twice, enforcing in one place and auditing in another. Start with Audit +
# Warn on a namespace you did not write, read the reports, then switch to Deny.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: damga-resource-bounds
spec:
  policyName: damga-resource-bounds
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        damga.co/policies: enforced
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: damga-image-provenance
spec:
  policyName: damga-image-provenance
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        damga.co/policies: enforced
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: damga-workload-hygiene
spec:
  policyName: damga-workload-hygiene
  validationActions: [Deny, Audit]
  matchResources:
    namespaceSelector:
      matchLabels:
        damga.co/policies: enforced
