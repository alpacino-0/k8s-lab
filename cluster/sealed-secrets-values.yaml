# The controller that decrypts SealedSecret objects into Secrets.
#
# Pinned by chart version like every other third-party release here. The image
# it pulls is worth watching: Bitnami is moving versioned tags out of
# docker.io/bitnami into docker.io/bitnamilegacy, and a `bitnamilegacy` mirror of
# this exact tag already exists. The day the pinned tag disappears from the
# primary repository, this is where it breaks.
resources:
  requests:
    cpu: 25m
    memory: 64Mi
  # No CPU limit, for the same reason nothing else here sets one.
  limits:
    memory: 192Mi

# The controller needs to write Secrets it does not own anywhere else.
networkPolicy:
  enabled: false
