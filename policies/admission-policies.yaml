# Validation rules enforced by Kubernetes itself.
#
# These were first written as Kyverno ClusterPolicies. Kyverno deprecated that
# API, but the more interesting problem was that none of these rules need a
# policy engine at all: ValidatingAdmissionPolicy has been GA since 1.30, runs
# inside the API server, and costs no pods, no memory and no upgrade path.
#
# Kyverno stays for the one thing this cannot do — verifying image signatures.
#
# Each policy binds to both the Pod and its controller. Binding to the Pod is
# what actually enforces; binding to the controller is what makes `kubectl
# apply` fail immediately instead of leaving a Deployment that quietly never
# produces a pod.
#
# The policies.kyverno.io/* annotations look out of place on a policy Kyverno
# does not own, and they are load-bearing anyway: Kyverno's reports controller
# reads them off native policies too, and without them every row it writes
# about these rules carries a null category and a null severity. Measured —
# adding them filled both fields on the next scan. A report that cannot say how
# serious a finding is cannot be the source of an evidence page.
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: damga-resource-bounds
  annotations:
    policies.kyverno.io/title: Every container declares what it needs and what it may take
    policies.kyverno.io/category: Resource governance
    policies.kyverno.io/severity: medium
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  variables:
    - name: containers
      expression: >-
        has(object.spec.template) ? object.spec.template.spec.containers : object.spec.containers
  validations:
    - expression: >-
        variables.containers.all(c,
          has(c.resources) && has(c.resources.requests)
          && 'cpu' in c.resources.requests && 'memory' in c.resources.requests
          && has(c.resources.limits) && 'memory' in c.resources.limits)
      message: >-
        Every container needs CPU and memory requests and a memory limit.
        Without requests the scheduler is guessing and the autoscaler cannot
        work; without a memory limit one container can take down its node.
      reason: Invalid
    # The per-container ceiling. A LimitRange is the usual way to express this
    # and cannot be used here: measured on this cluster, a LimitRange carrying
    # only `max` injects that max as the default request and limit, so a pod
    # that arrives with no resources at all is silently given 2Gi instead of
    # being rejected — and the rule above could never fire again. A rule that
    # only rejects has no such side effect.
    #
    # Guarded, because the rule above owns the "no limit at all" case: reading
    # a missing field would fail evaluation here first, and the author would
    # get this message instead of the one that names what is missing.
    - expression: >-
        variables.containers.all(c,
          !has(c.resources) || !has(c.resources.limits)
          || !('memory' in c.resources.limits)
          || !quantity(c.resources.limits.memory).isGreaterThan(quantity('2Gi')))
      message: >-
        No container may set a memory limit above 2Gi. One container asking for
        more than a small node can give is how a namespace stops scheduling
        anything at all.
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: damga-image-provenance
  annotations:
    policies.kyverno.io/title: Images come from this project's registry, by digest
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: high
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  variables:
    - name: containers
      expression: >-
        has(object.spec.template) ? object.spec.template.spec.containers : object.spec.containers
    # A locally built image is unsigned by construction, so admitting one means
    # admitting an image no signature rule can ever evaluate. That was allowed
    # everywhere by a bare `damga-` prefix, and the result was measured: the
    # `damga` namespace carries damga.co/policies=enforced, ran damga-app:1.0.0,
    # and its PolicyReport read three passes and no failures — while the same
    # application one namespace over read four, the fourth being "image
    # verified". Nothing distinguished "verified" from "never checked".
    #
    # The exemption is real and stays; what changes is that a namespace has to
    # ask for it. Same two-key shape the token exemption below uses and for the
    # same reason: labelling a namespace is a cluster-admin act, so no workload
    # can hand itself an unsigned image by editing its own manifest. A tenant
    # namespace created in phase 1 will not carry the label, which is the point.
    - name: unsignedPermitted
      expression: >-
        namespaceObject != null
          && has(namespaceObject.metadata.labels)
          && 'damga.co/unsigned-images' in namespaceObject.metadata.labels
          && namespaceObject.metadata.labels['damga.co/unsigned-images'] == 'permitted'
  validations:
    - expression: >-
        variables.containers.all(c, c.image.contains(':') && !c.image.endsWith(':latest'))
      message: >-
        Images must carry an explicit version. ":latest" and a bare repository
        name both mean "whatever is there today", which makes a rollback
        restore something other than what was rolled back from.
      reason: Invalid
    - expression: >-
        variables.containers.all(c,
          c.image.startsWith('ghcr.io/damgahq/')
          || c.image.startsWith('postgres:')
          || c.image.startsWith('redis:')
          || (variables.unsignedPermitted && c.image.startsWith('damga-')))
      message: >-
        Images must come from ghcr.io/damgahq, or the official postgres or
        redis repositories. Locally built damga-* images are admitted only in
        a namespace labelled damga.co/unsigned-images=permitted — they carry
        no signature, so nothing downstream can tell a verified image from an
        unchecked one unless the namespace says which it expects.
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: damga-workload-hygiene
  annotations:
    policies.kyverno.io/title: Read-only root, no ambient token, probes on anything long-running
    policies.kyverno.io/category: Workload hardening
    policies.kyverno.io/severity: medium
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets", "daemonsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
  variables:
    - name: podSpec
      expression: >-
        has(object.spec.template) ? object.spec.template.spec : object.spec
    # `in` tests for the key. Testing only that the label map exists and then
    # indexing it throws whenever the key is absent, and CEL absorbs that error
    # when the other side of an || is true — so the fault stayed invisible for
    # every workload that has probes, and surfaced only for one that does not:
    # exactly the case the message below exists to explain. The user saw a CEL
    # evaluation error instead of being told to add a probe.
    - name: isTask
      expression: >-
        (has(object.spec.template)
          ? (has(object.spec.template.metadata) && has(object.spec.template.metadata.labels)
             && 'app.kubernetes.io/component' in object.spec.template.metadata.labels
             && object.spec.template.metadata.labels['app.kubernetes.io/component'] == 'database-job')
          : (has(object.metadata.labels)
             && 'app.kubernetes.io/component' in object.metadata.labels
             && object.metadata.labels['app.kubernetes.io/component'] == 'database-job'))
    # The token rule's escape hatch, and the only one.
    #
    # A controller cannot run without a token, so a rule with no way to say so
    # has exactly one outcome in practice: the namespace holding the controller
    # is left out of the bindings, and every other rule here goes with it. That
    # is what happened to this project's own operator — it enforces these rules
    # on the workloads it renders while running outside all of them.
    #
    # Two keys, not one. The pod says it needs a token and the namespace says a
    # pod there may ask; a workload cannot grant itself the exemption by adding
    # a label to its own manifest. Labelling the namespace is a cluster-admin
    # act, which is the same shape the bindings above already use — a namespace
    # opts into the rules by carrying damga.co/policies, and opts into this
    # one exception by carrying damga.co/api-access: permitted.
    #
    # Written out per branch rather than sharing a resolved label map with
    # isTask above: this policy fails closed, and refactoring a rule that is
    # currently enforcing is not worth the saved lines.
    - name: needsAPIAccess
      expression: >-
        (namespaceObject != null
          && has(namespaceObject.metadata.labels)
          && 'damga.co/api-access' in namespaceObject.metadata.labels
          && namespaceObject.metadata.labels['damga.co/api-access'] == 'permitted')
        && (has(object.spec.template)
          ? (has(object.spec.template.metadata) && has(object.spec.template.metadata.labels)
             && 'damga.co/api-access' in object.spec.template.metadata.labels
             && object.spec.template.metadata.labels['damga.co/api-access'] == 'required')
          : (has(object.metadata.labels)
             && 'damga.co/api-access' in object.metadata.labels
             && object.metadata.labels['damga.co/api-access'] == 'required'))
  validations:
    - expression: >-
        variables.podSpec.containers.all(c,
          has(c.securityContext) && has(c.securityContext.readOnlyRootFilesystem)
          && c.securityContext.readOnlyRootFilesystem == true)
      message: >-
        Containers must run with a read-only root filesystem. Mount an emptyDir
        wherever the process genuinely needs to write — every workload here
        does, PostgreSQL included.
      reason: Invalid
    - expression: >-
        variables.needsAPIAccess
        || (has(variables.podSpec.automountServiceAccountToken)
            && variables.podSpec.automountServiceAccountToken == false)
      message: >-
        Set automountServiceAccountToken to false. A token mounted into a pod
        that never calls the Kubernetes API is a credential waiting to be
        stolen. A workload that genuinely needs one carries the label
        damga.co/api-access: required, in a namespace labelled
        damga.co/api-access: permitted. Both, so that no workload grants
        itself the exemption, and every one that holds it is greppable.
      reason: Invalid
    # A task that runs once and exits has nothing to probe, so it is exempt.
    - expression: >-
        variables.isTask
        || variables.podSpec.containers.all(c, has(c.readinessProbe) && has(c.livenessProbe))
      message: >-
        Long-running containers need a readiness and a liveness probe. Without
        readiness a pod takes traffic before it can serve it; without liveness a
        wedged process is never noticed.
      reason: Invalid
