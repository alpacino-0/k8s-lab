# The control plane: the panel, the API and the deploy write path, running in
# the cluster it manages.
#
# This did not exist until 2026-09-01, and its absence was the product's largest
# structural gap rather than a missing convenience. `chart/` deploys the
# reference tenant in `app/`; the published ghcr.io/damgahq/damga image is built
# from `./app`; docs/CONTROL-PLANE.md tells the reader to run the binary on a
# laptop. So the platform had a panel nobody could install — and every path that
# needs the server to hold a cluster identity was blocked on a ServiceAccount
# that could not exist, which is how the build-trigger endpoint ended up
# returning 501 for a reason that looked like a missing permission and was not.
apiVersion: v1
kind: Namespace
metadata:
  name: damga-system
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    app.kubernetes.io/managed-by: damga
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: damga
  namespace: damga-system
---
# Cluster-wide reads, and only reads.
#
# The control plane writes to git and to its own database; the one thing it
# reads from the cluster is what a Workload's Database says about its backups.
# That separation is deliberate and this Role is where it is enforced: no verb
# here creates, updates or deletes anything.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: damga-control-plane
rules:
  - apiGroups: ["platform.damga.co"]
    resources: [workloads, databases]
    verbs: [get, list, watch]
  # The deploy observer reads Deployments to learn what became of a commit.
  # Watching rather than polling, which is why watch is here.
  - apiGroups: ["apps"]
    resources: [deployments]
    verbs: [get, list, watch]
  # Log streaming. Pods to find which ones belong to a workload, pods/log to
  # read what they printed.
  #
  # Reading a tenant's application output is a new kind of access rather than
  # more of the same, and it is worth naming as one: everything above tells the
  # platform what it deployed, and this tells it what the deployed thing said.
  # Granted because a platform whose panel cannot show a log is a platform
  # people leave a terminal open beside. It was scoped to get and list, and this
  # sentence used to end "so nothing here can exec into a pod or delete one" —
  # see the pods/exec rule below, which reverses half of that on purpose. The
  # delete half still holds.
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list]
  - apiGroups: [""]
    resources: [pods/log]
    verbs: [get]
  # Running a command in a tenant's container, which is the one grant here that
  # is not a read.
  #
  # It reverses the sentence three rules above this one — "scoped to get and
  # list, so nothing here can exec into a pod or delete one" — and that
  # sentence was right when it was written. What changed is that the product
  # now offers the action: docs/PLAN.md counts `exec` as phase-A parity, and a
  # platform whose answer to "run this migration" is "get a kubeconfig" has
  # handed the user something larger than exec.
  #
  # What this grant actually is, said plainly: the control plane may run
  # arbitrary code in any pod it can see, which is every tenant's. That is
  # strictly more than every other rule in this ClusterRole combined, and it is
  # why the endpoint in front of it is owner-only (authz.ActionAppExec) and why
  # the delete verb is still absent — exec is asked for by the product, delete
  # is not.
  #
  # create and not get: the exec subresource is invoked with POST.
  - apiGroups: [""]
    resources: [pods/exec]
    verbs: [create]
  # Live CPU and memory for one tenant's app, which is what turns a restart
  # count into a diagnosis: a pod restarting every four minutes with memory at
  # 98% of its limit is a different conversation from one that is crashing.
  #
  # metrics-server serves this API and an install may not have one — k3s ships
  # it, kind does not — so the endpoint reports its absence by name rather than
  # showing zeros. This grant is what separates "no metrics-server here" from
  # "the control plane may not look", which are two different fixes.
  - apiGroups: ["metrics.k8s.io"]
    resources: [pods]
    verbs: [get, list]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: damga-control-plane
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: damga-control-plane
subjects:
  - kind: ServiceAccount
    name: damga
    namespace: damga-system
---
# The one place the control plane writes to the cluster, and it is scoped to one
# namespace on purpose.
#
# A Build is the exception to "the write path is git": a build is an action
# rather than a desired state, and it has to happen before there is a digest to
# commit. Confining that exception to damga-build means the control plane cannot
# create anything in a tenant's namespace even by mistake — its writes reach
# exactly one kind, in exactly one place.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: damga-builds
  namespace: damga-build
rules:
  - apiGroups: ["platform.damga.co"]
    resources: [builds]
    verbs: [get, list, watch, create]
  # No delete. A Build is the record of what produced a running image, and a
  # control plane that can remove one can remove the answer to "what is this".
  # Cleaning up old builds is a retention decision, not an API call.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: damga-builds
  namespace: damga-build
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: damga-builds
subjects:
  - kind: ServiceAccount
    name: damga
    namespace: damga-system
---
# Delivery: one Argo CD Application per placement, and nothing else in that
# namespace.
#
# This is the second thing the control plane writes to a cluster, and like the
# first it is scoped to one namespace and one kind. What it buys is the link the
# product was missing — a commit that something applies — and what it
# deliberately cannot do is delete: an Application that a server can remove is a
# tenant's whole deployment that a server can stop applying, silently, and the
# manifests would still be in git saying otherwise.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: damga-delivery
  namespace: argocd
rules:
  - apiGroups: ["argoproj.io"]
    resources: [applications]
    # patch and create, because delivery is idempotent: the same placement
    # delivered twice has to address the object the first call made rather than
    # fail on a name that already exists.
    verbs: [get, create, patch]
  - apiGroups: [""]
    resources: [secrets]
    # The repository credential Argo CD reads a tenant's state repository with.
    # Without it the Application above is created, the endpoint answers 201, and
    # Argo CD sits at "authentication required" — measured.
    #
    # No get, no list, no watch, and that is deliberate rather than minimal by
    # habit: this namespace also holds Argo CD's admin password and the
    # credentials for every cluster it deploys to. The control plane has no
    # reason to read any secret here, and a server-side apply does not need one
    # — it sends what it wants and the API server decides.
    verbs: [create, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: damga-delivery
  namespace: argocd
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: damga-delivery
subjects:
  - kind: ServiceAccount
    name: damga
    namespace: damga-system
---
# Leader election, so two replicas do not both observe deploys.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: damga-leader-election
  namespace: damga-system
rules:
  - apiGroups: ["coordination.k8s.io"]
    resources: [leases]
    verbs: [get, list, watch, create, update, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: damga-leader-election
  namespace: damga-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: damga-leader-election
subjects:
  - kind: ServiceAccount
    name: damga
    namespace: damga-system
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: damga-data
  namespace: damga-system
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests:
      # Accounts, sessions, placements and one row per deploy. Small, and the
      # retention window bounds the only part that grows.
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: damga
  namespace: damga-system
  labels:
    app.kubernetes.io/name: damga
    app.kubernetes.io/component: control-plane
    app.kubernetes.io/managed-by: damga
spec:
  replicas: 1
  # One replica, and Recreate, because the default DSN is SQLite on a
  # ReadWriteOnce claim — two pods cannot both mount it and a rolling update
  # would wait on a volume the old pod still holds. An install that points
  # -evidence-dsn at PostgreSQL can raise this; nothing here assumes it has.
  #
  # What that costs, measured rather than reasoned about: an upgrade leaves the
  # Service with no ready endpoint for about a second. Two runs on a single-node
  # kind cluster (Kubernetes v1.36.1, 2026-09-01), polling endpoints every ~30 ms
  # across the whole rollout: 25 samples of 400 and 35 of 125, each one unbroken
  # run — 0.9 s and 1.1 s. A busier machine, a slower volume or a database large
  # enough for a migration to take time all make it longer and none was tried.
  # The panel and the API are unavailable for that second; nothing already
  # deployed is, because this is not in a tenant's request path.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: damga
  template:
    metadata:
      labels:
        app.kubernetes.io/name: damga
    spec:
      serviceAccountName: damga
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: damga
          # A digest, which is what this line was always going to be.
          #
          # The history is worth keeping because it is how the gap survived: it
          # said :latest first, and CI never noticed, because the e2e job builds
          # the image into kind and overrides this field. On a real server it
          # was ImagePullBackOff while the manifest looked correct. Then it said
          # :unpublished, which was true — the publish job built the reference
          # tenant and the operator and no third image. It builds this one now.
          #
          # Why a digest is the destination is written out at length in
          # gitops/operator.yaml and gitops/application.yaml, and the argument
          # transfers whole: CI republishes :1.0.0, :latest and the commit sha
          # on every push to main, so :1.0.0 means "whatever is there today" as
          # surely as :latest does, and git naming exactly what runs is the
          # claim this repository is built to make.
          #
          # Two things are true here that are not true there, one in each
          # direction.
          #
          # Worse: those two are reconciled continuously, so a tag that has
          # moved is at least visible as drift. This file is applied by kubectl,
          # and `kubectl apply` of an unchanged pod template is a no-op — a new
          # version published under the same tag produces no rollout and the
          # apply reports success. Worse still, a tag other than :latest
          # defaults to imagePullPolicy: IfNotPresent, so a node that pulled
          # :1.0.0 last week keeps running last week's bytes while this line
          # says the same thing it always said. scripts/upgrade.sh prints the
          # running imageID for exactly this reason, and says "nothing moved"
          # rather than reporting a successful upgrade.
          #
          # Better: the digest could not be written until the image existed.
          # It does now, and this is that follow-up — the same one-commit lag
          # gitops/operator.yaml and gitops/application.yaml carry and call "a
          # release bumps this line", paid once here.
          #
          # The index digest and not a per-architecture one, which is the same
          # choice gitops/operator.yaml made: :1.0.0 resolves to an
          # application/vnd.oci.image.index.v1+json carrying linux/amd64 and
          # linux/arm64, and pinning one child would give half the fleet an
          # image it cannot run. Read off the registry rather than copied from a
          # build log:
          #
          #   docker buildx imagetools inspect ghcr.io/damgahq/damga-control-plane:1.0.0 \
          #     --format '{{.Manifest.MediaType}} {{.Manifest.Digest}}'
          #
          # And the lag has not gone away: CI republishes :1.0.0 on every push
          # to main, so this digest names the build before the one that carries
          # it. That is the property, not a defect — git names exactly what
          # runs, and what runs is a version that was actually published.
          image: ghcr.io/damgahq/damga-control-plane@sha256:2db0bc9f64657346e5edd422bc2d5f9cc15cca83dcaa8e97e0b6141a169bb28e
          args:
            - -listen-address=0.0.0.0:8080
            - -evidence-dsn=/data/damga.db
            - -observe-deploys
            - -leader-elect
            - -leader-election-namespace=damga-system
            # The registry a build pushes to, passed rather than compiled in.
            #
            # This value has to equal the Service in cluster/registry.yaml, and
            # saying so here is the whole reason it is a flag: the same string
            # already lives in that manifest and in CI's REGISTRY_HOST, and two
            # separate things in this repository have already cost a round by
            # holding one string in three places and drifting.
            #
            # Deliberately not validated by the server, which the session that
            # wrote the flag reported rather than fixed: an operator who puts a
            # tag here (host:5000/ci:v1) gets a composite whose last segment is
            # still clean, so the image rule does not catch it and the push
            # fails instead. Not tenant-reachable, so it is an operator's own
            # mistake — but it is one this line has to not make.
            - -registry=registry.damga-registry.svc:5000
            # Where the image put the catalogue. Empty would be a control plane
            # that serves everything except the one-click install and says so
            # with 503 rather than an empty list — see requireCatalog. That
            # behaviour is deliberate and stays; this flag is what turns it on.
            - -catalog-dir=/catalog
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 5
          livenessProbe:
            httpGet: { path: /healthz, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { memory: 512Mi }
          volumeMounts:
            - name: data
              mountPath: /data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: damga-data
---
apiVersion: v1
kind: Service
metadata:
  name: damga
  namespace: damga-system
spec:
  selector:
    app.kubernetes.io/name: damga
  ports:
    - name: http
      port: 80
      targetPort: http
