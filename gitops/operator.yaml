# The operator, reconciled from git like everything else.
#
# It was the exception. `make operator-deploy` pipes kustomize into kubectl,
# which is fine for a kind cluster that gets thrown away and wrong for one that
# persists: the platform's own control plane was the single component reaching
# the cluster outside the write path the platform exists to enforce. The
# product's one-sentence claim — nothing touches the cluster except through git
# — had an exception, and the exception was the newest and most privileged
# component in it.
#
# Not Terraform, deliberately. Terraform installs the third-party charts a
# cluster needs before this repository's code can run at all: ingress,
# cert-manager, Kyverno, Argo CD itself. The operator is this repository's
# code, versioned with it, released with it, and signed by the same pipeline.
# It belongs on the side of the line that reconciles from git.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: damga-platform
  namespace: argocd
  # No resources-finalizer here, unlike the application Application.
  #
  # This source carries the Workload CRD, and deleting a CRD deletes every
  # custom resource of that kind cluster-wide, without confirmation and without
  # a way back. Deleting this Application should stop managing the operator; it
  # should not be able to take every Workload in the cluster with it as a side
  # effect nobody typed.
spec:
  project: default

  source:
    repoURL: https://github.com/damgahq/damga.git
    targetRevision: main
    path: config/default
    kustomize:
      # The manifest in git carries kubebuilder's `controller:latest`
      # placeholder, which damga-image-provenance rejects twice over — for
      # the :latest tag and for the unknown registry. That is the useful
      # behaviour: an override that goes missing fails at admission with a
      # message naming the reason, rather than deploying a placeholder.
      #
      # A digest, not the moving 1.0.0 tag the application chart uses, and not
      # for the reason the Workload API gives everyone else.
      #
      # This used to say a tag could not converge here: Kyverno rewrote the
      # reference to the digest it had verified, so git said `:1.0.0`, the
      # cluster said `:1.0.0@sha256:...`, and Argo CD reported OutOfSync forever
      # while being exactly what git asked for. That engine and its policies were
      # removed. Nothing mutates this field now, and a tag would converge.
      #
      # The digest stays because the other half of the reason never depended on
      # the engine: CI republishes :1.0.0, :latest and the commit sha on every
      # push to main, so the tag means "whatever is there today" as surely as
      # :latest does. Git naming exactly what runs is the claim this repository
      # is built to make, and a republished tag cannot make it.
      #
      # Drift correction was measured on a live cluster — the image was changed
      # by hand and Argo CD reverted it within one reconcile. selfHeal is what
      # did that and it never involved the admission layer, but the measurement
      # was taken while the layer was installed and has not been repeated.
      #
      # The cost is that a release bumps this line. Argo CD Image Updater exists
      # to write it, and that is Phase 1's work.
      images:
        - controller=ghcr.io/damgahq/damga-operator@sha256:ab3f5d68fe885f3d8c0257e72a1da0c30150ff25853e46f4c51406fdabd499f9

  destination:
    server: https://kubernetes.default.svc
    namespace: damga-platform-system

  syncPolicy:
    automated:
      prune: true      # something deleted from git is deleted from the cluster
      selfHeal: true   # something changed by hand is changed back
    syncOptions:
      # Deliberately no CreateNamespace. The Namespace is one of the manifests
      # this source renders, and it carries the Pod Security Admission labels
      # that subject the operator to the rules it enforces on everyone else. A
      # namespace conjured by Argo CD would carry none of them and the
      # admission level would silently not apply — the failure this whole
      # change exists to close. Rendering it also means selfHeal restores those
      # labels, which managedNamespaceMetadata does not: measured against Argo
      # CD v3.1.8, a label removed from a namespace managed that way was never
      # put back.
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
