name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ghcr.io/${{ github.repository }}
  IMAGE_TAG: 1.0.0

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- code
  test:
    name: Lint and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
        working-directory: app
      - run: npm run lint
        working-directory: app
      - run: npm test
        working-directory: app

      - uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint
        working-directory: web
      - run: npm run build
        working-directory: web

  # ------------------------------------------------------- static analysis
  manifests:
    name: Validate manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Helm lint
        run: helm lint chart

      - name: Render every values profile
        run: |
          for f in chart/values.yaml chart/values-dev.yaml chart/values-prod.yaml; do
            echo "::group::$f"
            helm template ci chart -f "$f" --set postgres.auth.password=ci
            echo "::endgroup::"
          done

      - name: Validate the policy manifests
        run: |
          curl -sSLo kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xf kubeconform.tar.gz kubeconform
          ./kubeconform -strict -summary policies/

      - name: Validate rendered manifests against the Kubernetes schema
        run: |
          helm template ci chart -f chart/values-prod.yaml --set postgres.auth.password=ci \
            | ./kubeconform -strict -summary -ignore-missing-schemas -

      # Terraform is validated, never applied: this pipeline has no cluster it
      # is entitled to change, and a plan against one it does not own would be
      # either meaningless or dangerous.
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.1
          terraform_wrapper: false

      - name: Terraform formatting and validity
        run: |
          terraform -chdir=terraform fmt -check -diff
          terraform -chdir=terraform init -backend=false -input=false
          terraform -chdir=terraform validate

      - name: Lint the API Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: app/Dockerfile
          failure-threshold: warning

      - name: Lint the web Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: web/Dockerfile
          failure-threshold: warning

  # ------------------------------------------------------------- container
  image:
    name: Build and scan image
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "k8s-lab-app:${IMAGE_TAG}" ./app

      - name: Container must not run as root
        run: |
          uid=$(docker run --rm "k8s-lab-app:${IMAGE_TAG}" id -u)
          echo "container uid: $uid"
          [ "$uid" != "0" ] || { echo "image runs as root"; exit 1; }

      - name: Container must start with a read-only root filesystem
        run: |
          docker run -d --name ro --read-only --cap-drop ALL \
            --security-opt no-new-privileges -p 8080:3000 "k8s-lab-app:${IMAGE_TAG}"
          for _ in $(seq 1 20); do curl -sf localhost:8080/healthz && break || sleep 1; done
          curl -sf localhost:8080/healthz | grep -q ok
          docker rm -f ro

      - name: Scan the API image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: k8s-lab-app:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

      - name: Build the web image
        run: docker build -t "k8s-lab-web:${IMAGE_TAG}" ./web

      - name: Web container must not run as root
        run: |
          uid=$(docker run --rm --entrypoint id "k8s-lab-web:${IMAGE_TAG}" -u)
          echo "web container uid: $uid"
          [ "$uid" != "0" ] || { echo "web image runs as root"; exit 1; }

      - name: Web container must start with a read-only root filesystem
        run: |
          docker run -d --name web-ro --read-only --cap-drop ALL \
            --security-opt no-new-privileges \
            --tmpfs /tmp --tmpfs /var/cache/nginx --tmpfs /var/run \
            -p 8081:8080 "k8s-lab-web:${IMAGE_TAG}"
          for _ in $(seq 1 20); do curl -sf localhost:8081/healthz && break || sleep 1; done
          curl -sf localhost:8081/healthz | grep -q ok
          curl -s -D - -o /dev/null localhost:8081/ | grep -qi 'content-security-policy'
          docker rm -f web-ro

      - name: Scan the web image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: k8s-lab-web:${{ env.IMAGE_TAG }}
          format: table
          exit-code: '1'
          severity: CRITICAL,HIGH
          ignore-unfixed: true

  # ----------------------------------------------------------- integration
  e2e:
    name: Deploy to a real cluster
    runs-on: ubuntu-latest
    needs: [test, manifests]
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v5
        with:
          version: v3.16.3

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ci
          config: kind-config.yaml

      # Applied first, so the release has to satisfy them rather than being
      # grandfathered in — and so the API server has picked the bindings up
      # long before anything is tested against them.
      - name: Apply cluster policies
        run: |
          kubectl apply -f policies/namespace.yaml
          kubectl apply -f policies/admission-policies.yaml -f policies/admission-bindings.yaml

      # The zero-downtime check below measures through the ingress controller,
      # the same path a real user takes. `kubectl port-forward` is bound to one
      # pod, so a rollout kills the tunnel and the measurement, not the service.
      - name: Install ingress-nginx
        run: |
          kubectl apply -f https://raw.githubusercontent.com/kubernetes/ingress-nginx/controller-v1.13.0/deploy/static/provider/baremetal/deploy.yaml
          kubectl wait -n ingress-nginx --for=condition=Ready pod \
            -l app.kubernetes.io/component=controller --timeout=300s
          # Both ports, matching the two mappings in kind-config.yaml. Pinning
          # only HTTP leaves 8443 pointing at nothing, which is a confusing way
          # to fail: the certificate is issued, the listener is up, and the
          # connection simply never arrives.
          kubectl patch svc ingress-nginx-controller -n ingress-nginx --type=json \
            -p='[{"op":"replace","path":"/spec/ports/0/nodePort","value":30080},{"op":"replace","path":"/spec/ports/1/nodePort","value":30443}]'

      - name: Build and load the images
        run: |
          docker build -t "k8s-lab-app:${IMAGE_TAG}" ./app
          docker build -t "k8s-lab-web:${IMAGE_TAG}" ./web
          kind load docker-image "k8s-lab-app:${IMAGE_TAG}" "k8s-lab-web:${IMAGE_TAG}" --name ci

      - name: Policies must reject what they are meant to
        run: NAMESPACE=k8s-lab IMAGE="k8s-lab-app:${IMAGE_TAG}" ./scripts/policy-test.sh

      - name: Install the chart
        run: |
          helm upgrade --install app ./chart \
            --namespace k8s-lab \
            --set image.tag="${IMAGE_TAG}" \
            --set web.image.tag="${IMAGE_TAG}" \
            --set postgres.auth.password=ci-password \
            --set networkPolicy.enabled=true \
            --timeout 10m
          kubectl -n k8s-lab rollout status deployment/app-redis --timeout=300s
          kubectl -n k8s-lab rollout status statefulset/app-postgres --timeout=300s
          kubectl -n k8s-lab rollout status deployment/app-k8s-lab-app --timeout=300s
          kubectl -n k8s-lab rollout status deployment/app-k8s-lab-app-web --timeout=300s

      - name: The shared limit must bind across replicas
        run: |
          # With per-replica counters, N replicas give a client N times its
          # allowance. This is the regression test for that.
          kubectl -n k8s-lab set env deployment/app-k8s-lab-app READS_PER_MINUTE=30
          kubectl -n k8s-lab rollout status deployment/app-k8s-lab-app --timeout=300s
          kubectl -n k8s-lab port-forward svc/app-k8s-lab-app 18080:80 &
          sleep 5
          jar=$(mktemp); curl -sf -c "$jar" -o /dev/null http://127.0.0.1:18080/stats
          allowed=0
          for _ in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -b "$jar" http://127.0.0.1:18080/stats)
            [ "$code" = "200" ] && allowed=$((allowed+1))
            sleep 0.12
          done
          echo "allowed $allowed of 60 against a limit of 30"
          # Shared: about 30. Per replica: all 60 would pass.
          [ "$allowed" -le 35 ]
          kill %1 || true
          kubectl -n k8s-lab set env deployment/app-k8s-lab-app READS_PER_MINUTE-
          kubectl -n k8s-lab rollout status deployment/app-k8s-lab-app --timeout=300s

      # TLS is exercised, not just prepared. The only difference from a public
      # deployment is who signed the certificate: the Certificate resource, the
      # secret, the nginx TLS listener, the redirect and the Secure cookie are
      # the same objects doing the same work.
      - name: Issue a certificate and serve HTTPS
        run: |
          kubectl apply -f https://github.com/cert-manager/cert-manager/releases/download/v1.16.2/cert-manager.yaml
          kubectl wait -n cert-manager --for=condition=Available deployment --all --timeout=300s
          kubectl apply -f cluster/issuers.yaml
          kubectl wait --for=condition=Ready clusterissuer/selfsigned-ca --timeout=120s

          helm upgrade app ./chart -n k8s-lab \
            --set image.tag="${IMAGE_TAG}" --set web.image.tag="${IMAGE_TAG}" \
            --set postgres.auth.password=ci-password \
            --set ingress.tls.enabled=true \
            --set ingress.tls.clusterIssuer=selfsigned-ca \
            --set config.SECURE_COOKIE=true --timeout 10m
          kubectl -n k8s-lab wait --for=condition=Ready certificate/k8s-lab-app-tls --timeout=180s
          kubectl -n k8s-lab rollout status deployment/app-k8s-lab-app --timeout=300s

      - name: HTTPS, the redirect and the Secure cookie must all work
        run: |
          kubectl get svc -n ingress-nginx ingress-nginx-controller \
            -o jsonpath='{range .spec.ports[*]}{.name}={.nodePort} {end}{"\n"}'
          for _ in $(seq 1 30); do
            curl -sk -o /dev/null https://localhost:8443/api/healthz -H 'Host: app.local' && break || sleep 2
          done

          # served over TLS
          curl -sk -H 'Host: app.local' https://localhost:8443/api/healthz | grep -q ok
          echo "tls: ok"

          # the certificate is the one cert-manager issued
          echo | openssl s_client -connect localhost:8443 -servername app.local 2>/dev/null \
            | openssl x509 -noout -issuer | grep -q 'k8s-lab local CA'
          echo "issuer: ok"

          # plain HTTP is redirected, not served
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: app.local' http://localhost:8080/api/healthz)
          echo "http -> $code"; [ "$code" = "308" ]

          # The visitor cookie must be marked Secure. Retried, because the
          # release that turned it on has just rolled: the preStop delay keeps
          # replaced pods in the endpoint list for a few more seconds, and one
          # of them still answers with the old configuration. That window is
          # the feature working, not a flake to paper over — so the check waits
          # it out rather than asserting once and hoping.
          for attempt in $(seq 1 20); do
            headers=$(curl -sk -D - -o /dev/null -H 'Host: app.local' https://localhost:8443/api/stats)
            if grep -i 'set-cookie' <<<"$headers" | grep -q 'Secure'; then
              echo "secure cookie: ok (attempt $attempt)"
              exit 0
            fi
            sleep 2
          done
          echo "the visitor cookie never came back marked Secure. Last headers:"
          echo "$headers"
          kubectl -n k8s-lab get pods -l app.kubernetes.io/name=k8s-lab-app \
            -o custom-columns=NAME:.metadata.name,AGE:.metadata.creationTimestamp
          exit 1

      - name: Back to plain HTTP for the remaining checks
        run: |
          helm upgrade app ./chart -n k8s-lab \
            --set image.tag="${IMAGE_TAG}" --set web.image.tag="${IMAGE_TAG}" \
            --set postgres.auth.password=ci-password --timeout 10m
          kubectl -n k8s-lab rollout status deployment/app-k8s-lab-app --timeout=300s

      - name: Ingress must route both tiers
        run: |
          for _ in $(seq 1 30); do
            curl -sf -H 'Host: app.local' http://localhost:8080/api/healthz && break || sleep 2
          done
          # / goes to the interface, /api to the service behind it
          curl -sf -H 'Host: app.local' http://localhost:8080/ | grep -q '<div id="root"'
          curl -sf -H 'Host: app.local' http://localhost:8080/api/stats | grep -q servedBy
          # the scrape endpoint must not be publicly routable
          code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: app.local' http://localhost:8080/api/metrics)
          echo "GET /api/metrics -> $code"
          [ "$code" = "404" ]

      - name: Smoke test
        run: ./scripts/smoke-test.sh

      - name: Upgrade must be zero-downtime
        run: |
          # Record every outcome, not just failures, so the totals are meaningful.
          ( for _ in $(seq 1 200); do
              if curl -sf -m 3 -H 'Host: app.local' http://localhost:8080/healthz >/dev/null
              then echo OK; else echo DOWN; fi
              sleep 0.2
            done > /tmp/rollout.log ) &
          LOOP=$!
          helm upgrade app ./chart -n k8s-lab \
            --set image.tag="${IMAGE_TAG}" \
            --set web.image.tag="${IMAGE_TAG}" \
            --set postgres.auth.password=ci-password \
            --set config.GREETING=Upgraded --timeout 10m
          kubectl -n k8s-lab rollout status deployment/app-k8s-lab-app --timeout=300s
          wait $LOOP
          TOTAL=$(wc -l < /tmp/rollout.log)
          FAILED=$(grep -c DOWN /tmp/rollout.log || true)
          echo "requests through ingress: $TOTAL, failed: $FAILED"
          [ "$FAILED" -eq 0 ]

      - name: Diagnostics on failure
        if: failure()
        run: |
          kubectl -n k8s-lab get all,pvc,networkpolicy,ingress
          kubectl -n k8s-lab describe pods
          kubectl -n ingress-nginx get pods
          kubectl -n k8s-lab logs -l app.kubernetes.io/name=k8s-lab-app --tail=100 --all-containers || true
          kubectl -n k8s-lab get events --sort-by=.lastTimestamp | tail -40

  # -------------------------------------------------------------- publish
  publish:
    name: Publish image
    runs-on: ubuntu-latest
    needs: [image, e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: read
      packages: write
      id-token: write        # the OIDC token cosign signs with
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v4
      - uses: sigstore/cosign-installer@v3.7.0
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the API image
        id: api
        uses: docker/build-push-action@v7
        with:
          context: ./app
          push: true
          # Publish for both architectures: amd64 for most clusters, arm64 for
          # Apple Silicon and Graviton. Without this the image is amd64-only and
          # `docker pull` fails on arm64 with "no matching manifest".
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
            ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Publish the web image
        id: web
        uses: docker/build-push-action@v7
        with:
          context: ./web
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_NAME }}-web:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}-web:${{ github.sha }}
            ${{ env.IMAGE_NAME }}-web:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      # Keyless: no key to store, rotate or leak. cosign exchanges the
      # workflow's OIDC token for a short-lived certificate from Fulcio and
      # records the signature in the Rekor transparency log. What is verified
      # later is not "someone had the key" but "this workflow, in this
      # repository, produced this digest".
      - name: Sign the published images
        env:
          COSIGN_YES: "true"
        run: |
          cosign sign "${IMAGE_NAME}@${{ steps.api.outputs.digest }}"
          cosign sign "${IMAGE_NAME}-web@${{ steps.web.outputs.digest }}"

      - name: Verify the signatures the way the cluster will
        run: |
          for ref in "${IMAGE_NAME}@${{ steps.api.outputs.digest }}" \
                     "${IMAGE_NAME}-web@${{ steps.web.outputs.digest }}"; do
            cosign verify "$ref" \
              --certificate-identity-regexp "^https://github.com/${{ github.repository }}/" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com \
              > /dev/null
            echo "verified: $ref"
          done
