# The operator renders hardened workloads into namespaces that enforce Pod
# Security Admission and this project's ValidatingAdmissionPolicies. Its own
# namespace carried none of those labels, so the one component with permission
# to create Deployments across the cluster was the one component no rule
# applied to. These labels put it under the rules it exists to impose.
apiVersion: v1
kind: Namespace
metadata:
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: damga-platform
    app.kubernetes.io/managed-by: kustomize
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/enforce-version: latest
    pod-security.kubernetes.io/audit: restricted
    pod-security.kubernetes.io/warn: restricted
    # Three damga.co labels used to be here — the policy opt-in, the token
    # exemption and the unsigned-image exemption. Every rule that read them was
    # removed with the admission policies on 2026-08-29; what stayed was a
    # namespace claiming exemptions from nothing.
  name: system
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: controller-manager
  namespace: system
  labels:
    control-plane: controller-manager
    app.kubernetes.io/name: damga-platform
    app.kubernetes.io/managed-by: kustomize
spec:
  selector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: damga-platform
  replicas: 1
  template:
    metadata:
      annotations:
        kubectl.kubernetes.io/default-container: manager
      labels:
        control-plane: controller-manager
        app.kubernetes.io/name: damga-platform
    spec:
      # A controller is the one workload that genuinely cannot run without a
      # service-account token. This used to be declared as well as taken, in a
      # damga.co/api-access label that the damga-workload-hygiene policy read;
      # the policy went on 2026-08-29 and the label was left asking permission
      # of nothing, which reads as a control and is not one.
      automountServiceAccountToken: true
      # TODO(user): Uncomment the following code to configure the nodeAffinity expression
      # according to the platforms which are supported by your solution.
      # It is considered best practice to support multiple architectures. You can
      # build your manager image using the makefile target docker-buildx.
      # affinity:
      #   nodeAffinity:
      #     requiredDuringSchedulingIgnoredDuringExecution:
      #       nodeSelectorTerms:
      #         - matchExpressions:
      #           - key: kubernetes.io/arch
      #             operator: In
      #             values:
      #               - amd64
      #               - arm64
      #               - ppc64le
      #               - s390x
      #           - key: kubernetes.io/os
      #             operator: In
      #             values:
      #               - linux
      securityContext:
        # Projects are configured by default to adhere to the "restricted" Pod Security Standards.
        # This ensures that deployments meet the highest security requirements for Kubernetes.
        # For more details, see: https://kubernetes.io/docs/concepts/security/pod-security-standards/#restricted
        runAsNonRoot: true
        seccompProfile:
          type: RuntimeDefault
      containers:
      - command:
        - /manager
        args:
          - --leader-elect
          - --health-probe-bind-address=:8081
        image: controller:latest
        name: manager
        ports:
        - containerPort: 8081
          name: health
          protocol: TCP
        securityContext:
          readOnlyRootFilesystem: true
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - "ALL"
        livenessProbe:
          httpGet:
            path: /healthz
            port: 8081
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 8081
          initialDelaySeconds: 5
          periodSeconds: 10
        # No CPU limit, for the reason the Workload API states to everyone else:
        # CPU is compressible, so a limit buys nothing that the request does not
        # already guarantee and costs a latency cliff when the controller has a
        # burst of work to do — which for a reconciler is exactly the moment it
        # is furthest behind. Memory is not compressible, so it keeps its limit.
        #
        # The operator had shipped with `cpu: 500m` here, the scaffold's default,
        # while its own CRD documentation argued against precisely that.
        resources:
          limits:
            memory: 128Mi
          requests:
            cpu: 10m
            memory: 64Mi
        volumeMounts: []
      volumes: []
      serviceAccountName: controller-manager
      terminationGracePeriodSeconds: 10
