# The one rule that needs a policy engine.
#
# Everything else in policies/ is a ValidatingAdmissionPolicy running inside
# the API server. This is not, because the built-in engine has no way to reach
# a registry, fetch a signature and check it against an identity. That is the
# whole justification for Kyverno being installed.
#
# Applied by `make platform`, not by terraform and not by `make policies`.
#
# Terraform installs Kyverno but cannot plan against a ClusterPolicy, because
# the CRD does not exist until that release is applied — the same reason the
# cert-manager issuers sit outside it. It was left out of `make policies` too,
# which is worse than a missing line: terraform installed the engine, nothing
# installed the rule, and a cluster built by the documented path ran Kyverno
# enforcing nothing at all. The one capability Kyverno is here for was the one
# thing no path turned on.
#
# Scoped to this project's own registry namespace. Locally built damga-*
# images are unsigned by design — they never leave the machine — and the
# official postgres and redis images are signed by other identities entirely.
apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: verify-image-signatures
  annotations:
    policies.kyverno.io/title: Only run images this pipeline signed
    policies.kyverno.io/category: Supply chain
    policies.kyverno.io/severity: high
spec:
  validationFailureAction: Enforce
  background: false          # verification needs a registry call, not a replay
  webhookTimeoutSeconds: 30
  failurePolicy: Fail
  rules:
    - name: ghcr-images-must-be-signed
      match:
        any:
          - resources:
              kinds: [Pod]
              # The operator's namespace belongs here for the same reason the
              # others do, and more so: it is the only workload that can create
              # Deployments in namespaces it does not live in. Its image is
              # published and signed by the same pipeline and was, until this
              # line, the one image nothing ever checked.
              namespaces: ["damga", "damga-gitops", "damga-platform-system"]
      verifyImages:
        - imageReferences:
            - "ghcr.io/damgahq/damga*"
          # Rewrite the tag to the digest that was actually verified. Without
          # this a signed digest is checked and then a mutable tag is pulled,
          # which is a different image by the time it matters.
          mutateDigest: true
          required: true
          attestors:
            - count: 1
              entries:
                # Keyless: there is no public key to distribute. The claim is
                # that a workflow in this repository produced this digest, and
                # Fulcio and Rekor are what make that checkable.
                - keyless:
                    subject: "https://github.com/damgahq/damga/*"
                    issuer: "https://token.actions.githubusercontent.com"
                    rekor:
                      url: https://rekor.sigstore.dev
