# The smallest Workload that reaches Ready.
#
# port is set because the API defaults to 8080 and this image listens on 3000.
# No `domain`: the rendered Ingress asks for the letsencrypt-prod issuer, which
# a local cluster does not have. No `autoscale`: metrics-server is in the
# platform layer now, so the HPA would work — the sample leaves it out to show
# the smallest Workload that runs, not the most complete one.
apiVersion: platform.damga.co/v1alpha1
kind: Workload
metadata:
  labels:
    app.kubernetes.io/name: damga-platform
    app.kubernetes.io/managed-by: kustomize
  name: workload-sample
  namespace: damga
spec:
  image: ghcr.io/damgahq/damga:1.0.0
  port: 3000
  replicas: 2
