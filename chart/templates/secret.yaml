{{- if .Values.appSecret.create }}
{{- /*
  The values in this Secret are generated when they are not supplied, and never
  shipped as a known constant.

  This used to default to API_TOKEN: change-me. A chart's defaults are what most
  people actually run, the documentation recommending an external secret manager
  is read by fewer, and the application does not check the value — so the
  documented advice and the installed reality could differ with nothing to say
  so.

  Three sources, in order. A value set in values takes precedence, because an
  operator who names a secret means it. Otherwise the value already in the
  cluster is kept: `lookup` returns the live Secret, and without this branch
  every `helm upgrade` would rotate the token and restart every pod that reads
  it. Only when there is neither does it generate one, which makes the
  zero-configuration install safe rather than convenient.

  `lookup` returns nothing during `helm template` and on a dry run, so rendering
  without a cluster shows a fresh value each time. That is the documented
  behaviour and not a rotation — nothing is applied.
*/}}
{{- $name := include "app.fullname" . }}
{{- $live := (lookup "v1" "Secret" .Release.Namespace $name) | default dict }}
{{- $liveData := (get $live "data") | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "app.labels" . | nindent 4 }}
type: Opaque
data:
  {{- range $key, $value := .Values.appSecret.values }}
  {{- if $value }}
  {{ $key }}: {{ $value | toString | b64enc | quote }}
  {{- else if hasKey $liveData $key }}
  {{ $key }}: {{ get $liveData $key | quote }}
  {{- else }}
  {{ $key }}: {{ randAlphaNum 40 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
