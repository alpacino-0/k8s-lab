kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
# Without this the kubelet serves metrics with a self-signed certificate, and
# the only way to scrape it is to tell metrics-server not to check — which is
# the one thing this repository argues against everywhere else. With it the
# kubelet asks the cluster CA for a serving certificate instead, and the
# scrape is verified like any other TLS connection.
#
# The certificates are not granted automatically: kubelet-serving CSRs are the
# one signer kube-controller-manager will not auto-approve, because approving
# them means trusting the node's claim about its own addresses. bootstrap.sh
# approves them, which is the right call for a cluster it just created itself.
kubeadmConfigPatches:
  - |
    kind: KubeletConfiguration
    serverTLSBootstrap: true
# The one node-level thing the in-cluster registry needs, and the reason it
# cannot be avoided: containerd runs on the host and cannot resolve cluster DNS,
# so the name a build pod pushes to is a name the kubelet cannot look up. This
# points containerd at a directory of per-registry configuration; bootstrap.sh
# writes the file that redirects the registry's cluster name to the NodePort,
# which every node answers on. One image reference then works from both
# networks.
#
# Naming the registry `localhost:30500` everywhere fails in the other direction:
# inside a pod, localhost is the pod.
#
# docs/DEPLOY.md carries the k3s equivalent, which is a single file rather than
# a cluster flag.
containerdConfigPatches:
  - |-
    [plugins."io.containerd.grpc.v1.cri".registry]
      config_path = "/etc/containerd/certs.d"
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30080   # ingress-nginx HTTP
        hostPort: 8080
        protocol: TCP
      - containerPort: 30443   # ingress-nginx HTTPS
        hostPort: 8443
        protocol: TCP
  - role: worker
  - role: worker
