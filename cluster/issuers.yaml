# Certificate issuers. Cluster-scoped, so they live outside the chart for the
# same reason the policies do: a release should not install the authority that
# signs its certificate.
#
# Which one a deployment uses is a chart value:
#   --set ingress.tls.clusterIssuer=selfsigned-ca      (local)
#   --set ingress.tls.clusterIssuer=letsencrypt-staging (rehearsal)
#   --set ingress.tls.clusterIssuer=letsencrypt-prod    (public)
---
# A local certificate authority.
#
# This exists so the TLS path is exercised rather than assumed. The chart
# templates, the cert-manager annotation, the Certificate resource, the secret,
# the nginx TLS listener and the Secure cookie all behave exactly as they will
# in public — the only difference is who signed the certificate. A browser will
# warn; every other part of the mechanism is real.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-root
spec:
  selfSigned: {}
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: local-ca
  namespace: cert-manager      # where cert-manager looks for CA issuer secrets
spec:
  isCA: true
  commonName: k8s-lab local CA
  secretName: local-ca-key-pair
  duration: 8760h              # a year; it never leaves the cluster
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: selfsigned-root
    kind: ClusterIssuer
---
# Issues leaf certificates from the CA above. Named so that switching to
# Let's Encrypt is a one-word change in the release values.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: selfsigned-ca
spec:
  ca:
    secretName: local-ca-key-pair
